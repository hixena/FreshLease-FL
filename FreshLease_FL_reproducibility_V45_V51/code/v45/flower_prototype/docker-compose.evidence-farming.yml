x-image: &image
  image: node-access-flower-prototype:0.23
  build:
    context: ..
    dockerfile: flower_prototype/Dockerfile

x-client: &client
  <<: *image
  command: ["python", "-m", "flower_prototype.client"]
  depends_on:
    access-controller:
      condition: service_healthy
    flower-server:
      condition: service_started
  environment: &client-env
    ACCESS_URL: http://access-controller:8000
    FLOWER_SERVER: flower-server:8080
    MAX_ONBOARDING_TASKS: "24"
    POLL_SECONDS: "0.15"
    FLOWER_JOIN_DELAY: "1.0"
    EXPERIMENT_SEED: ${EXPERIMENT_SEED:-0}
    EXPECTED_EXPERIMENT_NODES: ${EXPECTED_EXPERIMENT_NODES:-10}
    BARRIER_TIMEOUT_SECONDS: ${BARRIER_TIMEOUT_SECONDS:-600}
    NETWORK_JITTER_SECONDS: "0.08"
    BENIGN_UNCONFIRMED_RATE: "0.03"
    DATA_MODE: ${DATA_MODE:-synthetic}
    DATASET_NAME: ${DATASET_NAME:-digits}
    DATASET_PATH: ${DATASET_PATH:-}
    NUM_DATA_PARTITIONS: ${NUM_DATA_PARTITIONS:-10}
    NONIID_ALPHA: ${NONIID_ALPHA:-0.5}
    LOCAL_EPOCHS: ${LOCAL_EPOCHS:-2}
    LOCAL_LEARNING_RATE: ${LOCAL_LEARNING_RATE:-0.15}
    POISON_FRACTION: ${POISON_FRACTION:-0.4}
    SIGN_FLIP_SCALE: ${SIGN_FLIP_SCALE:-3.0}
    GRADUAL_SIGN_FLIP_SCALE: ${GRADUAL_SIGN_FLIP_SCALE:-0.35}
    ATTACK_SCENARIO: ${ATTACK_SCENARIO:-all}
    ATTACK_START_ROUND: ${ATTACK_START_ROUND:-1}
    BENIGN_DRIFT_TRANSITION_ROUNDS: ${BENIGN_DRIFT_TRANSITION_ROUNDS:-4}
    BENIGN_DRIFT_TARGET_PARTITION: ${BENIGN_DRIFT_TARGET_PARTITION:-5}
    EXPERIMENT_VARIANT: ${MECHANISM_VARIANT:-full}
  restart: "no"

services:
  access-controller:
    <<: *image
    command: ["uvicorn", "flower_prototype.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ACCESS_DATA_DIR: /data
      TASK_DEADLINE_SECONDS: ${TASK_DEADLINE_SECONDS:-30}
      MAX_PROBATION_TASKS: ${MAX_PROBATION_TASKS:-20}
      MIN_PROBATION_COMPLETED_TASKS: ${MIN_PROBATION_COMPLETED_TASKS:-9}
      MIN_EVIDENCE_MASS: ${MIN_EVIDENCE_MASS:-1.50}
      MIN_LIMITED_CLEAN_UPDATES: ${MIN_LIMITED_CLEAN_UPDATES:-2}
      MIN_LIMITED_OBSERVATION_UPDATES: ${MIN_LIMITED_OBSERVATION_UPDATES:-2}
      LIMITED_AGGREGATION_WEIGHT: ${LIMITED_AGGREGATION_WEIGHT:-0.25}
      ACCESS_LEASE_FULL_UPDATES: ${ACCESS_LEASE_FULL_UPDATES:-5}
      MECHANISM_VARIANT: ${MECHANISM_VARIANT:-full}
      TRUST_ESTIMATOR: ${TRUST_ESTIMATOR:-dirichlet_lcb}
      INCUMBENT_NODE_IDS: ${INCUMBENT_NODE_IDS:-}
      FL_CONTROL_TOKEN: ${FL_CONTROL_TOKEN:-}
      SOURCE_VERIFIER_PUBLIC_KEY: ${SOURCE_VERIFIER_PUBLIC_KEY:-}
      EXPECTED_EXPERIMENT_NODES: ${EXPECTED_EXPERIMENT_NODES:-10}
    volumes:
      - controller-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 1s
      timeout: 2s
      retries: 30

  flower-server:
    <<: *image
    command: ["python", "-m", "flower_prototype.server"]
    environment:
      FLOWER_ROUNDS: ${FLOWER_ROUNDS:-20}
      FLOWER_MIN_CLIENTS: ${FLOWER_MIN_CLIENTS:-10}
      ACCESS_URL: http://access-controller:8000
      EXPECTED_EXPERIMENT_NODES: ${EXPECTED_EXPERIMENT_NODES:-10}
      BARRIER_TIMEOUT_SECONDS: ${BARRIER_TIMEOUT_SECONDS:-600}
      CLIENT_JOIN_TIMEOUT_SECONDS: ${CLIENT_JOIN_TIMEOUT_SECONDS:-300}
      DATA_MODE: ${DATA_MODE:-synthetic}
      DATASET_NAME: ${DATASET_NAME:-digits}
      DATASET_PATH: ${DATASET_PATH:-}
      GLOBAL_METRICS_PATH: /results/global_metrics.csv
      ROUND_NODE_EVENTS_PATH: /results/round_node_events.csv
      MECHANISM_VARIANT: ${MECHANISM_VARIANT:-full}
      CUMULATIVE_RISK_DECAY: ${CUMULATIVE_RISK_DECAY:-0.50}
      CUMULATIVE_RISK_THRESHOLD: ${CUMULATIVE_RISK_THRESHOLD:-0.90}
      SELF_REVERSAL_GATE: ${SELF_REVERSAL_GATE:-0.20}
      NORM_ESCALATION_MODE: ${NORM_ESCALATION_MODE:-enforce}
      AGGREGATION_RULE: ${AGGREGATION_RULE:-fedavg}
      TRIMMED_MEAN_COUNT: ${TRIMMED_MEAN_COUNT:-1}
      FLTRUST_ROOT_EPOCHS: ${FLTRUST_ROOT_EPOCHS:-1}
      FLTRUST_ROOT_LEARNING_RATE: ${FLTRUST_ROOT_LEARNING_RATE:-0.05}
      FLTRUST_ROOT_BATCH_SIZE: ${FLTRUST_ROOT_BATCH_SIZE:-32}
      RFFL_REPUTATION_FADE: ${RFFL_REPUTATION_FADE:-0.95}
      RFFL_REPUTATION_THRESHOLD_SCALE: ${RFFL_REPUTATION_THRESHOLD_SCALE:-0.3333333333333333}
      FL_CONTROL_TOKEN: ${FL_CONTROL_TOKEN:-}
    volumes:
      - flower-results:/results
    depends_on:
      access-controller:
        condition: service_healthy
    ports:
      - "8080:8080"

  honest-1:
    <<: *client
    environment:
      <<: *client-env
      NODE_ID: honest-1
      PROFILE: honest
      PARTITION_ID: "0"
    volumes: [honest-1-state:/state]

