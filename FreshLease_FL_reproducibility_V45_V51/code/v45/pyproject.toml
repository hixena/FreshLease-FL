[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "node-access-trust-phase1"
version = "0.21.0"
description = "第一阶段：节点动态接入历史信任模型可复现实验"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
  "seaborn>=0.12,<1",
  "PyYAML>=6,<7",
  "cryptography>=44,<47",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[project.scripts]
run-trust-experiment = "trust_experiment.cli:main"
run-validation-suite = "trust_experiment.validation_cli:main"
run-novelty-validation = "trust_experiment.novelty_cli:main"
run-sensitivity-validation = "trust_experiment.sensitivity_cli:main"
run-robustness-validation = "trust_experiment.robustness_cli:main"
run-selection-validation = "trust_experiment.selection_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
